<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI证券分析 - {{ name }}({{ code }})</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ai_chat.css') }}">
</head>
<body>
    <div class="ai-container">
        <!-- 输出框区域 (左上) -->
        <div class="output-area">
            <div class="section-label">AI输出框</div>
            <textarea id="output-text" readonly></textarea>
        </div>

        <!-- 输入框区域 (左下) -->
        <div class="input-area">
            <div class="section-label">用户输入框</div>
            <textarea id="input-text" placeholder="请输入您的问题..."></textarea>
        </div>

        <!-- 右侧预设问题区域 -->
        <div class="suggestion-area">
            <div class="section-label">预设问题</div>
            <div class="suggestion-buttons">
                <button class="preset-btn" data-question="进行基本面分析">进行基本面分析</button>
                <button class="preset-btn" data-question="进行技术面分析">进行技术面分析</button>
                <button class="preset-btn" data-question="分析价格趋势">分析价格趋势</button>
                <button class="preset-btn" data-question="分析成交量变化">分析成交量变化</button>
                <button class="preset-btn" data-question="评估技术指标">评估技术指标</button>
                <button class="preset-btn" data-question="给出投资建议">给出投资建议</button>
                <button class="preset-btn" data-question="分析风险因素">分析风险因素</button>
                <button class="preset-btn" data-question="总结投资要点">总结投资要点</button>
            </div>
        </div>

        <!-- 底部功能按钮区域（已按新顺序调整） -->
        <div class="action-buttons">
            <button id="btn-send">发送</button>
            <button id="btn-clear">清空对话</button>
            <button id="btn-export-data">导出证券数据</button>
            <button id="btn-report">输出分析报告</button>
            <button id="btn-close">关闭</button>
        </div>
    </div>

    <script>
        // 传递URL参数给JS
        window.securityInfo = {
            code: "{{ code }}",
            name: "{{ name }}",
            type: "{{ sec_type }}",
            exchange: "{{ exchange }}"
        };
    </script>
    <script src="{{ url_for('static', filename='js/ai_chat.js') }}"></script>
</body>
</html>
