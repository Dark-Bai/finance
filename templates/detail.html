<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>证券详情 - {{ name }} ({{ code }})</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/detail.css') }}">
    <!-- SheetJS 库用于导出 xlsx -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="detail-container">
        <!-- 左侧：图表主区域 -->
        <div class="detail-main">
            <!-- K线类型与指标选择组合区域 -->
            <div class="kline-indicator-bar">
                <div class="kline-type-selector">
                    <span class="label">K线类型：</span>
                    <label><input type="radio" name="kline_type" value="日K" checked> 日K</label>
                    <label><input type="radio" name="kline_type" value="周K"> 周K</label>
                    <label><input type="radio" name="kline_type" value="月K"> 月K</label>
                    <label><input type="radio" name="kline_type" value="5分钟"> 5分钟</label>
                    <label><input type="radio" name="kline_type" value="15分钟"> 15分钟</label>
                    <label><input type="radio" name="kline_type" value="30分钟"> 30分钟</label>
                    <label><input type="radio" name="kline_type" value="60分钟"> 60分钟</label>
                </div>
                <div class="indicator-selector">
                    <span class="label">技术指标：</span>
                    <label><input type="radio" name="indicator" value="成交量" checked> 成交量</label>
                    <label><input type="radio" name="indicator" value="成交额"> 成交额</label>
                    <label><input type="radio" name="indicator" value="RSI"> RSI</label>
                    <label><input type="radio" name="indicator" value="KDJ"> KDJ</label>
                    <label><input type="radio" name="indicator" value="MACD"> MACD</label>
                </div>
            </div>
            <div class="chart-area">
                <!-- K线图 Canvas -->
                <canvas id="canvas-kline" width="970" height="300"></canvas>
                <!-- 指标图 Canvas -->
                <canvas id="canvas-indicator" width="970" height="120"></canvas>
                <!-- 第二时间轴 Canvas (缩略时间轴) -->
                <canvas id="canvas-second-timeline" width="970" height="40"></canvas>
                <!-- 时间轴 Canvas (含滑块) -->
                <canvas id="canvas-timeline" width="970" height="50"></canvas>
            </div>
        </div>

        <!-- 右侧：信息面板与操作按钮 -->
        <div class="detail-sidebar">
            <!-- 基本信息区域 -->
            <div class="info-panel" id="info-panel">
                <h3>证券详情</h3>
                <div id="security-info">
                    <p>证券名称: {{ name }}</p>
                    <p>证券代码: {{ code }}</p>
                    <p>证券种类: {{ sec_type }}</p>
                    <p>交易板块: {{ exchange }}</p>
                </div>
                <div id="hover-info" style="display: none;">
                    <!-- 鼠标悬停时动态填充交易数据 + 技术指标值 -->
                </div>
            </div>
            <div class="sidebar-buttons">
                <button class="btn-fundamental" id="btn-fundamental">基本面信息</button>
                <button class="btn-ai" id="btn-ai">AI分析</button>
                <button class="btn-toolbox" id="btn-toolbox">工具箱</button>
                <button class="btn-export" id="btn-export-history">导出历史数据</button>
                <button class="btn-close" id="btn-close-detail" onclick="window.location.href='/'">关闭</button>
            </div>
        </div>
    </div>

    <!-- 传递证券参数给 JavaScript -->
    <script>
        window.securityInfo = {
            code: "{{ code }}",
            name: "{{ name }}",
            type: "{{ sec_type }}",
            exchange: "{{ exchange }}"
        };
    </script>
    <script src="{{ url_for('static', filename='js/detail.js') }}"></script>
</body>
</html>
